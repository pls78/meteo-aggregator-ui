         pushing the edges off-screen). -->

      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

  </head>
  <body>
    <!--
    THESIS: the consensus drawn as evidence — a meteogram, not an app skin; refuses the glass-card weather-app default by showing model spread as marks.
    OWN-WORLD: paper-white data ground with hairline rules; ink ramp; consensus blue (also location A); reserved red for location B; faint per-model ticks under every daily value; quiet Positron map as the field; system sans, tabular numerals, tracked-caps figure labels.
    STORY: a visitor reads one blended forecast, sees at a glance how tightly the models agree, and drills into hours or the per-model figure without leaving the map.
    FIRST VIEWPORT: full-bleed muted map; search top-left; forecast card top-right — large current temp, seven hairline-ruled day rows each carrying a spread strip; layers bottom-left.
    FORM: The Meteogram, candidate 3 of the remaining grounded list, user-pinned after reversing canon; seed key d8a5e4e2.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
    -->
