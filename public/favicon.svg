<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Lucide "cloud" silhouette, same icon as the About dialog header -->
    <path id="c" d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6-1.5A4 4 0 0 0 6 19z"/>
  </defs>

  <!-- Three stacked clouds, each offset down-left toward the front, to evoke aggregation. -->
  <!-- back cloud (top-right, faded) -->
  <use href="#c" transform="translate(11.05 7.1) scale(0.82) translate(-1.9 -5.3)" fill="url(#g)" opacity="0.34"/>
  <!-- mid cloud, with a white halo to separate it from the layer behind -->
  <use href="#c" transform="translate(7.75 10.4) scale(0.82) translate(-1.9 -5.3)" fill="none" stroke="#fff" stroke-width="2.4" stroke-opacity="0.92"/>
  <use href="#c" transform="translate(7.75 10.4) scale(0.82) translate(-1.9 -5.3)" fill="url(#g)" opacity="0.6"/>
  <!-- front cloud (bottom-left, full colour) -->
  <use href="#c" transform="translate(4.45 13.7) scale(0.82) translate(-1.9 -5.3)" fill="none" stroke="#fff" stroke-width="2.4" stroke-opacity="0.95"/>
  <use href="#c" transform="translate(4.45 13.7) scale(0.82) translate(-1.9 -5.3)" fill="url(#g)"/>
</svg>
