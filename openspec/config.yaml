schema: spec-driven

# Project context shown to AI when creating artifacts.
context: |
  Map-driven weather UI. A full-screen, pannable/zoomable Leaflet map where the user
  clicks a point (or uses a search box) to select a location and sees aggregated weather
  overlaid. Shift+click selects a second location for side-by-side comparison. Toggleable
  WMS satellite layers (cloud/IR/lightning/etc.) can be overlaid on the map on demand.

  Tech stack: Vite + React + TypeScript + Tailwind CSS + react-leaflet (Leaflet).
  Server state via @tanstack/react-query; client UI state in a small store.

  Backend: the Python/FastAPI aggregator at ../meteo-aggregator (no PHP). The UI calls it
  directly over HTTP at VITE_API_BASE_URL. Keyless GET endpoints:
    - GET /search?name&count&language  -> Place[] (name -> lat/lon)
    - GET /forecast?lat&lon&days       -> daily consensus + confidence + per-model breakdown
    - GET /hourly?lat&lon&hours        -> hourly consensus (hours[0] = current conditions)
    - GET /imagery?time                -> WMS layer params (EPSG:3857, tiles fetched directly
                                          from EUMETSAT, not proxied)
  weather_code values are WMO codes (map to icons). Units are metric only. No auth, no i18n.
